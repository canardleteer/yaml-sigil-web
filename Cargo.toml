[package]
name = "yaml-sigil-web"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.0"
license = "Apache-2.0"
publish = false
description = "In-browser YAML Sigil playground (sign, verify, compose, decompose)"
repository = "https://github.com/canardleteer/yaml-sigil-web"
authors = ["canardleteer"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
base64 = "0.22"
buffa = "0.5"
console_error_panic_hook = "0.1"
ed25519-dalek = { version = "2.1", default-features = false, features = [
    "alloc",
    "rand_core",
    "zeroize",
] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = { version = "=0.3.104", default-features = false, features = ["std"] }
noyalib = { version = "0.0.26", default-features = false, features = ["std"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
plot_icon = { version = "0.3.0", default-features = false, features = ["vec"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = "0.8"
serde_json = "1.0"
wasm-bindgen = "=0.2.127"
yaml-sigil-core = { git = "https://github.com/canardleteer/yaml-sigil-rs", branch = "feat/wasm", default-features = false }
yaml-sigil-signing = { git = "https://github.com/canardleteer/yaml-sigil-rs", branch = "feat/wasm", default-features = false }
yaml-sigil-transcription = { git = "https://github.com/canardleteer/yaml-sigil-rs", branch = "feat/wasm", default-features = false }
yaml-sigil-verification = { git = "https://github.com/canardleteer/yaml-sigil-rs", branch = "feat/wasm", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "DomRect",
    "Node",
    "NodeList",
    "Location",
    "Url",
    "Window",
    "console",
]
