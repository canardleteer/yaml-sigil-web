[workspace]
members = [".", "xtask"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.98.0"

[workspace.dependencies]
anyhow = "1.0.100"
clap = { version = "4.6.7", features = ["derive"] }

[package]
name = "yaml-sigil-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license = "Apache-2.0"
publish = false
description = "In-browser YAML Sigil playground (sign, verify, compose, decompose)"
repository = "https://github.com/canardleteer/yaml-sigil-web"
authors = ["canardleteer"]

[lib]
crate-type = ["cdylib", "rlib"]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"

[dependencies]
base64 = "0.23"
console_error_panic_hook = "0.1"
ed25519-dalek = { version = "3.0", default-features = false, features = [
    "alloc",
    "fast",
    "rand_core",
    "zeroize",
] }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = { version = "=0.3.105", default-features = false, features = ["std"] }
noyalib = { version = "0.0.43", default-features = false, features = ["std"] }
p256 = { version = "0.14", default-features = false, features = ["ecdsa"] }
plot_icon = { version = "0.3.0", default-features = false, features = ["vec"] }
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rand = { version = "0.10", default-features = false, features = [
    "std",
    "std_rng",
    "sys_rng",
    "thread_rng",
] }
serde_json = "1.0"
wasm-bindgen = "=0.2.128"
# Pinned to the current commit on yaml-sigil-rs main (be0103f6081f75e0833532d0eeccfa38c7bd8477).
# Note: we generally want to track `main` until yaml-sigil-rs is published to crates.io.
yaml-sigil-core = { git = "https://github.com/NVIDIA/yaml-sigil-rs", rev = "be0103f6081f75e0833532d0eeccfa38c7bd8477", default-features = false }
yaml-sigil-signing = { git = "https://github.com/NVIDIA/yaml-sigil-rs", rev = "be0103f6081f75e0833532d0eeccfa38c7bd8477", default-features = false }
yaml-sigil-transcription = { git = "https://github.com/NVIDIA/yaml-sigil-rs", rev = "be0103f6081f75e0833532d0eeccfa38c7bd8477", default-features = false }
yaml-sigil-verification = { git = "https://github.com/NVIDIA/yaml-sigil-rs", rev = "be0103f6081f75e0833532d0eeccfa38c7bd8477", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[target.wasm32-unknown-unknown.dependencies]
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[dependencies.web-sys]
version = "0.3"
features = [
    "Blob",
    "BlobPropertyBag",
    "CanvasRenderingContext2d",
    "CssStyleDeclaration",
    "Document",
    "DomTokenList",
    "Element",
    "Event",
    "EventTarget",
    "HtmlAnchorElement",
    "HtmlButtonElement",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "DomRect",
    "Node",
    "NodeList",
    "Location",
    "Url",
    "Window",
    "console",
]
